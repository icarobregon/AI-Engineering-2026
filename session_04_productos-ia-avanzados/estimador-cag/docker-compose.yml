services:
  backend:
    build: .
    container_name: estimador-cag-backend
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: ../../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  frontend:
    build: .
    container_name: estimador-cag-frontend
    command: >
      uv run streamlit run streamlit_app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
    env_file: ../../.env
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
