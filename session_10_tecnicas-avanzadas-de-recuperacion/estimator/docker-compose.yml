# Docker Compose configuration for local development.
# For production, remove the bind mount and the --reload flag.

services:
  estimator:
    build: .
    container_name: estimator
    ports:
      - "8000:8000"

    # Load environment variables (API keys, config) from the local .env file.
    env_file:
      - .env

    # Override service URLs for the in-network services. The .env values are
    # meant for running uvicorn outside Docker.
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+psycopg://estimator:estimator@estimator-postgres:5432/estimator
      # Session 10: point the cross-encoder weight cache at the hf_cache volume
      # instead of the container filesystem, which is discarded on recreation.
      HF_HOME: /home/appuser/.cache/huggingface

    depends_on:
      redis:
        condition: service_healthy
      estimator-postgres:
        condition: service_healthy

    # Bind-mount the app/ directory so code changes are reflected immediately
    # inside the container without rebuilding the image. Tests, data and alembic
    # too: the live session adds ingest sources to data/seed/ and a migration
    # under alembic/versions/, both expected to survive a container restart.
    volumes:
      - ./app:/app/app
      - ./tests:/app/tests
      - ./data:/app/data
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      # tests/test_evals_*.py and tests/test_stress_*.py import the `evals`
      # package, which the image does not copy (it is not runtime code). Without
      # this mount those four modules fail at COLLECTION, which aborts the whole
      # run before a single test executes.
      - ./evals:/app/evals
      # pytest reads its configuration from [tool.pytest.ini_options] in
      # pyproject.toml. The image only copies app/, so without this mount pytest
      # runs with no config: asyncio_mode falls back to "strict" and every async
      # test fails with "async def functions are not natively supported" — a
      # configuration failure that reads exactly like broken code. Read-only:
      # nothing in the container has any business writing the manifest.
      - ./pyproject.toml:/app/pyproject.toml:ro
      # Session 10: cross-encoder weights (~450MB) land in the HuggingFace cache
      # on first rerank. Without a volume every container recreation re-downloads
      # them. Ownership matters here: the image runs as the non-root `appuser`,
      # and Docker initializes a fresh named volume from the image's directory
      # (ownership included) — which is why the Dockerfile creates this path owned
      # by appuser. Without that, the volume is root-owned and the first rerank
      # dies with PermissionError.
      - hf_cache:/home/appuser/.cache/huggingface

    # Apply pending migrations on startup, then run uvicorn with auto-reload.
    # Remove --reload for production deployments.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

    restart: unless-stopped

    # Health check using Python's stdlib (curl is not available in slim images).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  redis:
    # Redis Stack bundles the RediSearch + RedisJSON modules that redisvl uses
    # to do vector similarity queries for the semantic cache. The vanilla
    # ``redis:7-alpine`` image does NOT ship these modules.
    image: redis/redis-stack:7.4.0-v0
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight UI (handy during the live demo)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Service name is estimator-postgres (not plain "postgres") so it does not
  # collide with any other "postgres" service when the root docker-compose.yml
  # pulls subprojects in via `include:` (which forbids duplicate resource
  # names across included files).
  estimator-postgres:
    # pgvector/pgvector:pg16 ships the pgvector extension already compiled.
    # The Session 8 migration activates it (CREATE EXTENSION vector).
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
      POSTGRES_DB: estimator
    # Session 8 live: tuning for HNSW index builds. Parallel builds use shared
    # memory, hence shm_size. The -c values are conservative so they work on
    # any reasonable dev machine; in real production they scale with the RAM
    # of the host (rule of thumb: shared_buffers ~25% of RAM,
    # effective_cache_size ~75%, maintenance_work_mem as much as one index
    # build needs without starving the rest).
    shm_size: 1gb
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c work_mem=64MB
      -c maintenance_work_mem=512MB
      -c max_parallel_maintenance_workers=2
    ports:
      # Port 5433 on the host to avoid colliding with a local Postgres
      # (5432). Inside the network we still talk on 5432.
      - "5433:5432"
    volumes:
      - estimator_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "estimator", "-d", "estimator"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  estimator_postgres_data:
  # Cross-encoder weights (~450MB). Persisting them across container recreations
  # turns a 450MB download into a 20s model load.
  hf_cache:
