[project]
name = "estimator"
version = "0.1.0"
description = "AI-powered software estimation service with typed input and versioned Jinja2 prompts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "litellm>=1.50",
    "instructor>=1.5",
    "redis>=5.0",
    "redisvl>=0.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "fpdf2>=2.7",
    # Session 7 — embedding pipeline (tiktoken for token counting; openai already above)
    "tiktoken>=0.7.0",
    # Session 7 live — chunking strategies comparison
    "langchain-text-splitters>=0.3.0",
    "langchain-experimental>=0.3.0",
    "langchain-openai>=0.2.0",
    "nltk>=3.9",
    # Session 8 — pgvector persistence (async driver + vector type for SQLAlchemy)
    "asyncpg>=0.29",
    "pgvector>=0.3",
    # SQLAlchemy's async engine requires greenlet; declared explicitly so host
    # runs (scripts/evals via `uv run`) work, not only the Docker image.
    "greenlet>=3.0",
    # Session 9 — RAG API hardening (per-API-key rate limiting)
    "slowapi>=0.1.9",
    # Session 10 — cross-encoder reranking (recall-then-rerank). Pulls torch.
    "sentence-transformers>=3.0",
    # Declared explicitly although it arrives through sentence-transformers:
    # `[tool.uv.sources]` only binds DIRECT dependencies, and without this line the
    # CPU index below is ignored and linux/x86_64 resolves the CUDA build.
    "torch>=2.0",
    # Session 6 — data-driven AI
    "pandas>=2.2",
    "pandera>=0.20",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "openpyxl>=3.1",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "faker>=24.0",
    "langgraph>=1.0.1",
    "langgraph-checkpoint-postgres>=3.0.5",
    "logfire[asyncpg,fastapi,httpx]>=5.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Session 15 — the public entry point is the Next.js app in ../business-backend,
    # so the Streamlit client is a development tool, not a runtime dependency. It was
    # never even copied into the image (the Dockerfile copies app/, alembic/, data/
    # and scripts/), so it shipped ~190 MB — itself plus pyarrow and pydeck — as a
    # dependency of a consumer the container does not contain.
    "streamlit>=1.40",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "fakeredis>=2.20",
    "deepeval>=1.0",
    # Session 11 — RAGAS evaluation harness (scripts/eval_ragas_s11.py). Dev-only:
    # the runtime image builds with `uv sync --no-install-project --no-dev`, so none
    # of this ships to production.
    "ragas>=0.4.3",
    # ragas 0.4.3 hard-imports `langchain_community.chat_models.vertexai`, which the
    # sunset langchain-community 0.4.x removed: `import ragas` raises ModuleNotFound
    # without this ceiling. Holding community below 0.4 keeps the whole langchain
    # stack on 0.3.x, which still satisfies every range this project declares
    # (langchain-text-splitters, -experimental, -openai) and keeps the suite green.
    "langchain-community<0.4",
]

# Session 15 — torch resolves to the CUDA build on linux/x86_64 (uv.lock gates 36
# `nvidia-*` packages, ~3.9 GB of wheels, on `platform_machine == 'x86_64' and
# sys_platform == 'linux'`). This arm64 image never saw them; a build for a cloud
# PaaS would. The service has no GPU anywhere in its compose, so the CPU index is
# pinned for linux and macOS keeps resolving from PyPI as before.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.logfire]
# The service configures Logfire in its lifespan; tests and one-off scripts
# import the nodes without it and would otherwise warn on every span. Spans with
# no configuration are a supported mode here, not a mistake.
ignore_no_config = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
