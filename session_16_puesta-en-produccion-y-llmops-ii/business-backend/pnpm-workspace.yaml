packages:
  - "."

# Prisma's postinstall fetches its engines. pnpm 11 blocks lifecycle scripts by
# default, so it is allowed here explicitly — and declaratively, which is what
# makes the Docker build work too (an interactive `pnpm approve-builds` would not).
allowBuilds:
  "@prisma/engines": true
  prisma: true
  # Resolvedor nativo que arrastra eslint-config-next. En false a proposito: se
  # comprobo que ESLint resuelve los imports sin su binario, y lo que hacia falta
  # era decidirlo —mientras la entrada este a medias, `pnpm run` aborta—, no
  # ejecutar un script de instalacion que no aporta nada aqui.
  unrs-resolver: false
